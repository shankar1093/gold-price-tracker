# .github/workflows/deploy.yml
name: Deploy to AWS ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip building and pushing images'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 263095946180
  IMAGE_NAME: gold-price-tracker
  ECS_CLUSTER: mjw-prod
  ECS_SERVICE: mjw-retail-micro

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      if: ${{ !inputs.skip_build }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      if: ${{ !inputs.skip_build }}
      uses: docker/setup-buildx-action@v3

    - name: Pull Node.js base image
      if: ${{ !inputs.skip_build }}
      run: |
        docker pull public.ecr.aws/docker/library/node:20-alpine

    - name: Set up environment variables
      if: ${{ !inputs.skip_build }}
      run: |
        # Create .env.production for frontend
        echo "BACKEND_URL=${{ secrets.FRONTEND_BACKEND_URL }}" > frontend/.env.production
        echo "HOSTNAME=${{ secrets.FRONTEND_HOSTNAME }}" >> frontend/.env.production
        echo "API_KEY=${{ secrets.API_KEY }}" >> frontend/.env.production
        # Add Instagram variables
        echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> frontend/.env.production
        echo "INSTAGRAM_USER_ID=${{ secrets.INSTAGRAM_USER_ID }}" >> frontend/.env.production
        
        # Create .env.production for mjw_services backend
        echo "DB_PASSWORD=${{ secrets.PYTHON_DB_PASSWORD }}" > backend/mjw_services/.env.production
        echo "POSTGRES_USER=rate_service" >> backend/mjw_services/.env.production
        echo "POSTGRES_DB=mjw" >> backend/mjw_services/.env.production
        echo "DATABASE_URL=postgres://rate_service:${{ secrets.PYTHON_DB_PASSWORD }}@db:5432/mjw" >> backend/mjw_services/.env.production

    # NEW: Clear frontend build cache and debug
    - name: Clear frontend build cache and debug
      if: ${{ !inputs.skip_build }}
      working-directory: ./frontend
      run: |
        echo "=== Current directory structure ==="
        pwd
        ls -la
        
        echo "=== Clearing frontend build cache ==="
        rm -rf .next
        
        echo "=== Checking Tailwind config ==="
        head -20 tailwind.config.js
        
        echo "=== Checking PostCSS config ==="
        cat postcss.config.js
        
        echo "=== Checking package.json dependencies ==="
        npm list @types/react-slick || echo "react-slick types missing"
        
        echo "=== Installing dependencies to ensure types are available ==="
        npm install

    - name: Build and push Frontend image
      if: ${{ !inputs.skip_build }}
      env:
        COMMIT_HASH: ${{ github.sha }}
      run: |
        docker buildx build --no-cache --platform linux/amd64 \
          -f frontend/Dockerfile \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-frontend:${{ env.COMMIT_HASH }} \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-frontend:latest \
          --push frontend

    - name: Create ECR repository for static builder if needed
      if: ${{ !inputs.skip_build }}
      run: |
        aws ecr describe-repositories \
          --repository-names gold-price-tracker-static-builder \
          --region ${{ env.AWS_REGION }} || \
        aws ecr create-repository \
          --repository-name gold-price-tracker-static-builder \
          --region ${{ env.AWS_REGION }}

    - name: Build and push Static Builder image
      if: ${{ !inputs.skip_build }}
      env:
        COMMIT_HASH: ${{ github.sha }}
      run: |
        docker buildx build --platform linux/amd64 \
          -f frontend/Dockerfile.static \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-static-builder:latest \
          --push frontend

    - name: Build and push Rust Backend image
      if: ${{ !inputs.skip_build }}
      env:
        COMMIT_HASH: ${{ github.sha }}
      run: |
        docker buildx build --platform linux/amd64 \
          -f backend/gold_price_service/Dockerfile \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-rust-backend:${{ env.COMMIT_HASH }} \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-rust-backend:latest \
          --push backend/gold_price_service

    - name: Build and push Python Backend image
      if: ${{ !inputs.skip_build }}
      env:
        COMMIT_HASH: ${{ github.sha }}
      run: |
        docker buildx build --platform linux/amd64 \
          -f backend/mjw_services/Dockerfile \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-python-backend:${{ env.COMMIT_HASH }} \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-python-backend:latest \
          --push backend/mjw_services
          
          
    - name: Build and push PostgreSQL image
      if: ${{ !inputs.skip_build }}
      env:
        COMMIT_HASH: ${{ github.sha }}
      run: |
        docker buildx build --platform linux/amd64 \
          -f db/Dockerfile \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-postgres:${{ env.COMMIT_HASH }} \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}-postgres:latest \
          --push db

    - name: Stop containers on EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          # Navigate to deployment directory
          cd /home/ec2-user
          
          # Run the cleanup script
          chmod +x cleanup_docker.sh
          ./cleanup_docker.sh
        
    - name: Force ECS Service Update
      run: |
        aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --deployment-configuration minimumHealthyPercent=0,maximumPercent=100 --force-new-deployment
        
    - name: Start ECS agent on EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          # Navigate to deployment directory
          cd /home/ec2-user
          
          # Run the cleanup script
          chmod +x cleanup_docker.sh
          ./enable_ecs.sh

    - name: Wait for service stability
      run: |
        aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }}

    - name: Run static builder on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        timeout: 10m
        script: |
          # Log in to ECR
          aws ecr get-login-password --region ap-south-1 | \
            sudo docker login --username AWS --password-stdin \
            263095946180.dkr.ecr.ap-south-1.amazonaws.com

          # Pull latest static builder image
          sudo docker pull 263095946180.dkr.ecr.ap-south-1.amazonaws.com/gold-price-tracker-static-builder:latest

          # Run the static builder — uses host network so python-backend resolves to localhost
          sudo docker run --rm \
            --network host \
            --add-host python-backend:127.0.0.1 \
            -e CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }} \
            -e CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }} \
            263095946180.dkr.ecr.ap-south-1.amazonaws.com/gold-price-tracker-static-builder:latest

    - name: Stop EC2 instance
      run: |
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" \
          --query 'Reservations[0].Instances[0].InstanceId' \
          --output text)
        aws ec2 stop-instances --instance-ids $INSTANCE_ID
        echo "✅ EC2 instance $INSTANCE_ID stopped"

    - name: Deployment Success Notification
      if: success()
      run: |
        echo "✅ Deployment successful — static site deployed to Cloudflare Pages"
        echo "Commit: ${{ github.sha }}"