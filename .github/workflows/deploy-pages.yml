name: Build & Deploy to Cloudflare Pages

on:
  # Rebuild daily at 6:30 AM IST (1:00 AM UTC) to pick up fresh prices
  schedule:
    - cron: '0 1 * * *'
  # Also deploy on every push to main
  push:
    branches:
      - main
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build static site and deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          STATIC_EXPORT: 'true'
          # Django backend URL — must be publicly accessible during build
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: npm run build:static

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mjw-website
          directory: frontend/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
