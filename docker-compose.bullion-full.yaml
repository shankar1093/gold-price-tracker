version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=mjw
      - POSTGRES_USER=rate_service
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rate_service -d mjw"]
      interval: 5s
      timeout: 5s
      retries: 5

  rust_backend:
    build:
      context: backend/gold_price_service
      dockerfile: Dockerfile
    environment:
      RUST_LOG: "info"
      API_SECRET: ${API_SECRET}
    ports:
      - "8080:8080"
    restart: always
    networks:
      - app-network

  python-backend:
    build: ./backend/mjw_services
    environment:
      DATABASE_URL: postgres://rate_service:${DB_PASSWORD}@db:5432/mjw
      POSTGRES_USER: rate_service
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mjw
      DB_HOST: db
      RUST_BACKEND_URL: http://rust_backend:8080
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      PHOTOS_S3_BUCKET: ${PHOTOS_S3_BUCKET}
      PHOTOS_BASE_URL: ${PHOTOS_BASE_URL:-}
    ports:
      - "8000:8000"
    restart: always
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/src/app/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend/mjw_services:/usr/src/app
      - ./backend/mjw_services/wait-for-it.sh:/usr/src/app/wait-for-it.sh
      - ./backend/mjw_services/entrypoint.sh:/usr/src/app/entrypoint.sh

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: "http://python-backend:8000"
    ports:
      - "3000:3000"
    restart: always
    networks:
      - app-network
    depends_on:
      - python-backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    networks:
      - app-network
    depends_on:
      - frontend
      - rust_backend

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  postgres_data:
